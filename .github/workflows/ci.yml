name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: sparktal
          POSTGRES_USER: sparktal
          POSTGRES_PASSWORD: sparktal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sparktal -d sparktal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # There is no .env in CI. Settings refuse to start without a secret key when DEBUG is
      # off, and mypy's Django plugin loads the settings too.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://sparktal:sparktal@localhost:5432/sparktal
      REDIS_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml

      - name: Pytest
        run: uv run pytest
