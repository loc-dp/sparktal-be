<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F5F4;border-radius:13px;">
  <tr><td style="padding:6px 20px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {% for label, value in facts %}
      <tr>
        <td style="padding:12px 0;{% if not forloop.last %}border-bottom:1px solid #E4E4E7;{% endif %}font-size:13px;font-weight:500;color:#52525B;width:38%;vertical-align:top;">{{ label }}</td>
        <td style="padding:12px 0;{% if not forloop.last %}border-bottom:1px solid #E4E4E7;{% endif %}font-size:14px;font-weight:600;color:#0B0B0F;vertical-align:top;">{{ value }}</td>
      </tr>
      {% endfor %}
    </table>
  </td></tr>
</table>
