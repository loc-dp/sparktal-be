name: sparktal

services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: sparktal
      POSTGRES_USER: sparktal
      POSTGRES_PASSWORD: sparktal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent directory (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparktal -d sparktal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://sparktal:sparktal@postgres:5432/sparktal
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      FRONTEND_URL: http://localhost:3000
      FRONTEND_ORIGINS: http://localhost:3000
    volumes:
      - .:/app
      - media:/app/media
    ports:
      # 8000 is taken on this machine by another project, so the API is 8001 here.
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Linux containers fork cleanly, so the default prefork pool works here —
    # unlike a worker started on the macOS host, which needs --pool=solo.
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://sparktal:sparktal@postgres:5432/sparktal
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Fires CELERY_BEAT_SCHEDULE (the export and CV-parse purges); the worker runs them.
    # The schedule state file stays out of the bind-mounted source tree.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://sparktal:sparktal@postgres:5432/sparktal
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
