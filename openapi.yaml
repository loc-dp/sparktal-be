  /api/v1/applications/{id}/messages:
    get:
      operationId: applications_messages_list
      description: Messages about this candidate in the (job, recruiter) channel;
        both sides can post.
      parameters:
      - in: query
        name: before
        schema:
          type: string
          format: date-time
        description: Return older messages.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1–50, default 30.
      tags:
      - hiring
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: applications_messages_create
      description: Messages about this candidate in the (job, recruiter) channel;
        both sides can post.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionMessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiscussionMessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscussionMessageCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
