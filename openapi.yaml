openapi: 3.0.3
info:
  title: Sparktal API
  version: 1.0.0
  description: Sparktal Platform V.1 — Company portal API.
paths:
  /api/v1/applications/{id}:
    get:
      operationId: applications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
  /api/v1/applications/{id}/approval-requests:
    post:
      operationId: applications_approval_requests_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
