  /api/v1/candidates:
    get:
      operationId: candidates_list
      parameters:
      - in: query
        name: is_expat
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -expected_salary
          - -full_name
          - -updated_at
          - -years_experience
          - created_at
          - expected_salary
          - full_name
          - updated_at
          - years_experience
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: skills
        schema:
          type: string
      tags:
      - candidates
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateList'
          description: ''
    post:
      operationId: candidates_create
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
  /api/v1/candidates/{id}:
    get:
