      operationId: jobs_reopen_create
      description: 'Shared lookup: 404 (never 403) when the user may not touch this
        job.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/counts:
    get:
      operationId: jobs_counts_retrieve
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCounts'
          description: ''
  /api/v1/marketplace/jobs:
    get:
      operationId: marketplace_jobs_list
      parameters:
      - in: query
        name: function
        schema:
          type: string
          enum:
          - data
          - design
          - engineering
          - finance
          - legal
          - marketing
          - operations
          - other
          - sales
        description: |-
          * `finance` - Finance
          * `engineering` - Engineering
          * `data` - Data
          * `design` - Design
          * `legal` - Legal
          * `marketing` - Marketing
          * `sales` - Sales
          * `operations` - Operations
          * `other` - Other
      - in: query
        name: joined
        schema:
          type: boolean
      - in: query
        name: location
        schema:
          type: string
          enum:
          - bd
          - bn
          - ct
          - dn
          - dnai
          - hcm
          - hn
          - hp
          - other
        description: |-
          * `hcm` - Ho Chi Minh City
          * `hn` - Ha Noi
          * `dn` - Da Nang
          * `hp` - Hai Phong
          * `ct` - Can Tho
          * `bd` - Binh Duong
          * `dnai` - Dong Nai
          * `bn` - Bac Ninh
          * `other` - Other province
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: work_model
        schema:
          type: string
          enum:
          - hybrid
          - onsite
          - remote
        description: |-
          * `onsite` - On-site
          * `hybrid` - Hybrid
          * `remote` - Remote
      tags:
      - marketplace
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarketplaceJobListItemList'
          description: ''
  /api/v1/marketplace/jobs/{id}:
    get:
      operationId: marketplace_jobs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
