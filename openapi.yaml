openapi: 3.0.3
info:
  title: Sparktal API
  version: 1.0.0
  description: Sparktal Platform V.1 — Company portal API.
paths:
  /api/v1/csrf:
    get:
      operationId: csrf_retrieve
      tags:
      - csrf
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    KindEnum:
      enum:
      - company
      - recruiter
      - staff
      type: string
      description: |-
        * `company` - Company
        * `recruiter` - Recruiter
        * `staff` - Staff
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        company:
          type: object
          additionalProperties: {}
          nullable: true
          description: Plan 03 adds the models; until then nobody has a membership.
          readOnly: true
        recruiter:
          type: object
          additionalProperties: {}
          nullable: true
          description: Plan 03 fills this from `user.recruiter`.
          readOnly: true
      required:
      - company
      - email
      - full_name
      - id
      - recruiter
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
