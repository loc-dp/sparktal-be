        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
  /api/v1/applications/{id}/cv:
    get:
      operationId: applications_cv_retrieve
      description: Stream a single CV through the configured Django storage backend.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{id}/cv/inline:
    get:
      operationId: applications_cv_inline_retrieve
      description: The submitted PDF for the in-page viewer; other formats have no
        inline view.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{id}/cv/text:
    get:
      operationId: applications_cv_text_retrieve
