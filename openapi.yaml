components:
  schemas:
    ApplicationActionEnum:
      enum:
      - move_forward
      - set_interview
      - next_interview
      - request_approval
      - offer
      - hire
      - archive
      type: string
      description: |-
        * `move_forward` - Move forward
        * `set_interview` - Set interview
        * `next_interview` - Next interview
        * `request_approval` - Request approval
        * `offer` - Offer
        * `hire` - Mark hired
        * `archive` - Archive
    ApplicationCandidate:
      type: object
      properties:
        full_name:
          type: string
          readOnly: true
        current_title:
          type: string
          readOnly: true
      required:
      - current_title
      - full_name
    ApplicationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          allOf:
          - $ref: '#/components/schemas/DetailJob'
          readOnly: true
        candidate:
          allOf:
          - $ref: '#/components/schemas/CandidateFacts'
          readOnly: true
        recruiter:
          allOf:
          - $ref: '#/components/schemas/ApplicationRecruiter'
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/StageEnum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        stage_changed_at:
          type: string
          format: date-time
          readOnly: true
        rejected_reason:
          type: string
          readOnly: true
        is_duplicate:
          type: boolean
          readOnly: true
        first_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cv_filename:
          type: string
          readOnly: true
        cv_kind:
          allOf:
          - $ref: '#/components/schemas/CvKindEnum'
          readOnly: true
        reason_for_leaving:
          type: string
          readOnly: true
        motivation:
          type: string
          readOnly: true
        other_notes:
          type: string
