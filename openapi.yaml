openapi: 3.0.3
info:
  title: Sparktal API
  version: 1.0.0
  description: Sparktal Platform V.1 — Company portal API.
paths:
  /api/v1/company:
    get:
      operationId: company_retrieve
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: company_partial_update
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/company/banner:
    put:
      operationId: company_banner_update
      tags:
      - companies
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: company_banner_destroy
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/company/complete:
    post:
      operationId: company_complete_create
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/company/logo:
    put:
      operationId: company_logo_update
      tags:
      - companies
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: company_logo_destroy
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/csrf:
    get:
      operationId: csrf_retrieve
      tags:
      - csrf
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/jobs:
    get:
      operationId: jobs_list
      parameters:
      - in: query
        name: function
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - closed
          - pending
        description: |-
          * `pending` - Pending
          * `active` - Active
          * `closed` - Closed
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListItemList'
          description: ''
    post:
      operationId: jobs_create
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/{id}:
    get:
      operationId: jobs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/{id}/close:
    post:
      operationId: jobs_close_create
      description: 'Shared lookup: 404 (never 403) when the user may not touch this
        job.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/{id}/overview:
    get:
      operationId: jobs_overview_retrieve
      description: 'Shared lookup: 404 (never 403) when the user may not touch this
        job.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOverview'
          description: ''
  /api/v1/jobs/{id}/reopen:
    post:
      operationId: jobs_reopen_create
      description: 'Shared lookup: 404 (never 403) when the user may not touch this
        job.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/counts:
    get:
      operationId: jobs_counts_retrieve
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCounts'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/public/jobs/{share_token}:
    get:
      operationId: public_jobs_retrieve
      parameters:
      - in: path
        name: share_token
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BountyTypeEnum:
      enum:
      - pct
      - fixed
      type: string
      description: |-
        * `pct` - % of annual salary
        * `fixed` - Fixed amount
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        industry:
          oneOf:
          - $ref: '#/components/schemas/IndustryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        company_type:
          oneOf:
          - $ref: '#/components/schemas/CompanyTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        year_incorporated:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        size_range:
          oneOf:
          - $ref: '#/components/schemas/SizeRangeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        bd_headcount:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        located:
          oneOf:
          - $ref: '#/components/schemas/LocationEnum'
          - $ref: '#/components/schemas/BlankEnum'
        about:
          type: string
        website:
          type: string
          maxLength: 200
        linkedin:
          type: string
          maxLength: 200
        facebook:
          type: string
          maxLength: 200
        logo_url:
          type: string
          nullable: true
          readOnly: true
        banner_url:
          type: string
          nullable: true
          readOnly: true
        profile_completed:
          type: boolean
          readOnly: true
        offices:
          type: array
          items:
            $ref: '#/components/schemas/Office'
        can_edit:
          type: boolean
          readOnly: true
      required:
      - banner_url
      - can_edit
      - id
      - logo_url
      - name
      - profile_completed
    CompanyTypeEnum:
      enum:
      - fdi
      - vn
      type: string
      description: |-
        * `fdi` - FDI
        * `vn` - Vietnamese company
    FunctionEnum:
      enum:
      - finance
      - engineering
      - data
      - design
      - legal
      - marketing
      - sales
      - operations
      - other
      type: string
      description: |-
        * `finance` - Finance
        * `engineering` - Engineering
        * `data` - Data
        * `design` - Design
        * `legal` - Legal
        * `marketing` - Marketing
        * `sales` - Sales
        * `operations` - Operations
        * `other` - Other
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    IndustryEnum:
      enum:
      - banking_finance
      - fintech
      - technology_software
      - ecommerce_retail
      - manufacturing
      - logistics_supply_chain
      - healthcare_pharma
      - real_estate_construction
      - fmcg
      - energy_utilities
      type: string
      description: |-
        * `banking_finance` - Banking & Finance
        * `fintech` - Fintech
        * `technology_software` - Technology & Software
        * `ecommerce_retail` - E-commerce & Retail
        * `manufacturing` - Manufacturing
        * `logistics_supply_chain` - Logistics & Supply Chain
        * `healthcare_pharma` - Healthcare & Pharma
        * `real_estate_construction` - Real Estate & Construction
        * `fmcg` - FMCG
        * `energy_utilities` - Energy & Utilities
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        function:
          allOf:
          - $ref: '#/components/schemas/FunctionEnum'
          readOnly: true
        why_we_need_you:
          type: string
        roles:
          type: string
          description: One responsibility per line.
        qualifications:
          type: string
          description: One must-have per line.
        nice_to_have:
          type: string
        benefits:
          type: string
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        pay_basis:
          $ref: '#/components/schemas/PayBasisEnum'
        work_model:
          $ref: '#/components/schemas/WorkModelEnum'
        office:
          type: string
          format: uuid
          nullable: true
        location_label:
          type: string
          readOnly: true
        bounty_type:
          $ref: '#/components/schemas/BountyTypeEnum'
        bounty_pct:
          type: integer
          nullable: true
        bounty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        skills:
          type: array
          items:
            type: string
            maxLength: 40
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        note_for_recruiters:
          type: string
        share_token:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        can_edit:
          type: boolean
          readOnly: true
      required:
      - can_edit
      - closed_at
      - created_at
      - function
      - id
      - location_label
      - published_at
      - qualifications
      - roles
      - share_token
      - status
      - title
      - why_we_need_you
    JobCounts:
      type: object
      properties:
        pending:
          type: integer
        active:
          type: integer
        closed:
          type: integer
      required:
      - active
      - closed
      - pending
    JobKpis:
      type: object
      properties:
        days_open:
          type: integer
        applicants:
          type: integer
        screen:
          type: integer
        interviewing:
          type: integer
        offer:
          type: integer
      required:
      - applicants
      - days_open
      - interviewing
      - offer
      - screen
    JobListItem:
      type: object
      description: 'The My jobs row: every number comes from `annotate_job_metrics`.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        function:
          $ref: '#/components/schemas/FunctionEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        work_model:
          $ref: '#/components/schemas/WorkModelEnum'
        location_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
        share_token:
          type: string
          readOnly: true
        cv_count:
          type: integer
          readOnly: true
        new_count:
          type: integer
          readOnly: true
        current_stage:
          type: string
          nullable: true
          readOnly: true
        days_open:
          type: integer
          readOnly: true
        days_to_onboard:
          type: integer
          readOnly: true
          nullable: true
        bounty_label:
          type: string
          readOnly: true
      required:
      - bounty_label
      - created_at
      - current_stage
      - cv_count
      - days_open
      - days_to_onboard
      - id
      - location_label
      - new_count
      - share_token
      - title
    JobOverview:
      type: object
      properties:
        kpis:
          $ref: '#/components/schemas/JobKpis'
        new_applicants:
          type: array
          items:
            $ref: '#/components/schemas/NewApplicant'
        rejection_log:
          type: array
          items:
            $ref: '#/components/schemas/Rejection'
        recruiters:
          type: array
          items:
            $ref: '#/components/schemas/RecruiterOnJob'
        note_for_recruiters:
          type: string
      required:
      - kpis
      - new_applicants
      - note_for_recruiters
      - recruiters
      - rejection_log
    JobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        why_we_need_you:
          type: string
          minLength: 1
        roles:
          type: string
          minLength: 1
          description: One responsibility per line.
        qualifications:
          type: string
          minLength: 1
          description: One must-have per line.
        nice_to_have:
          type: string
        benefits:
          type: string
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        pay_basis:
          $ref: '#/components/schemas/PayBasisEnum'
        work_model:
          $ref: '#/components/schemas/WorkModelEnum'
        office:
          type: string
          format: uuid
          nullable: true
        bounty_type:
          $ref: '#/components/schemas/BountyTypeEnum'
        bounty_pct:
          type: integer
          nullable: true
        bounty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
        note_for_recruiters:
          type: string
      required:
      - qualifications
      - roles
      - title
      - why_we_need_you
    KindEnum:
      enum:
      - company
      - recruiter
      - staff
      type: string
      description: |-
        * `company` - Company
        * `recruiter` - Recruiter
        * `staff` - Staff
    LocationEnum:
      enum:
      - hcm
      - hn
      - dn
      - hp
      - ct
      - bd
      - dnai
      - bn
      - other
      type: string
      description: |-
        * `hcm` - Ho Chi Minh City
        * `hn` - Ha Noi
        * `dn` - Da Nang
        * `hp` - Hai Phong
        * `ct` - Can Tho
        * `bd` - Binh Duong
        * `dnai` - Dong Nai
        * `bn` - Bac Ninh
        * `other` - Other province
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        company:
          allOf:
          - $ref: '#/components/schemas/MeCompany'
          nullable: true
          readOnly: true
        recruiter:
          allOf:
          - $ref: '#/components/schemas/MeRecruiter'
          nullable: true
          readOnly: true
      required:
      - company
      - email
      - full_name
      - id
      - recruiter
    MeCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        profile_completed:
          type: boolean
      required:
      - id
      - name
      - profile_completed
      - role
    MeRecruiter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
      required:
      - id
      - nickname
    NewApplicant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate_name:
          type: string
        current_title:
          type: string
        recruiter_nickname:
          type: string
        submitted_at:
          type: string
          format: date-time
        is_duplicate:
          type: boolean
      required:
      - candidate_name
      - current_title
      - id
      - is_duplicate
      - recruiter_nickname
      - submitted_at
    Office:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        address:
          type: string
          maxLength: 255
        city:
          $ref: '#/components/schemas/LocationEnum'
        position:
          type: integer
          readOnly: true
      required:
      - address
      - id
      - position
    OfficeRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 255
        city:
          $ref: '#/components/schemas/LocationEnum'
      required:
      - address
    PaginatedJobListItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobListItem'
    PatchedCompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        industry:
          oneOf:
          - $ref: '#/components/schemas/IndustryEnum'
          - $ref: '#/components/schemas/BlankEnum'
        company_type:
          oneOf:
          - $ref: '#/components/schemas/CompanyTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        year_incorporated:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        size_range:
          oneOf:
          - $ref: '#/components/schemas/SizeRangeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        bd_headcount:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        located:
          oneOf:
          - $ref: '#/components/schemas/LocationEnum'
          - $ref: '#/components/schemas/BlankEnum'
        about:
          type: string
        website:
          type: string
          maxLength: 200
        linkedin:
          type: string
          maxLength: 200
        facebook:
          type: string
          maxLength: 200
        offices:
          type: array
          items:
            $ref: '#/components/schemas/OfficeRequest'
    PatchedJobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        why_we_need_you:
          type: string
          minLength: 1
        roles:
          type: string
          minLength: 1
          description: One responsibility per line.
        qualifications:
          type: string
          minLength: 1
          description: One must-have per line.
        nice_to_have:
          type: string
        benefits:
          type: string
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        pay_basis:
          $ref: '#/components/schemas/PayBasisEnum'
        work_model:
          $ref: '#/components/schemas/WorkModelEnum'
        office:
          type: string
          format: uuid
          nullable: true
        bounty_type:
          $ref: '#/components/schemas/BountyTypeEnum'
        bounty_pct:
          type: integer
          nullable: true
        bounty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
        note_for_recruiters:
          type: string
    PayBasisEnum:
      enum:
      - gross
      - net
      type: string
      description: |-
        * `gross` - Gross
        * `net` - Net
    PublicJob:
      type: object
      description: 'What anyone with the share link may see: no bounty, no internal
        notes.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        function:
          $ref: '#/components/schemas/FunctionEnum'
        why_we_need_you:
          type: string
        roles:
          type: string
          description: One responsibility per line.
        qualifications:
          type: string
          description: One must-have per line.
        nice_to_have:
          type: string
        benefits:
          type: string
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        pay_basis:
          $ref: '#/components/schemas/PayBasisEnum'
        work_model:
          $ref: '#/components/schemas/WorkModelEnum'
        location_label:
          type: string
          readOnly: true
        skills:
          type: array
          items:
            type: string
            maxLength: 40
        published_at:
          type: string
          format: date-time
          nullable: true
        company:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - company
      - id
      - location_label
      - qualifications
      - roles
      - title
      - why_we_need_you
    RecruiterOnJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        cv_count:
          type: integer
      required:
      - cv_count
      - id
      - nickname
    Rejection:
      type: object
      properties:
        candidate_name:
          type: string
        reason:
          type: string
        rejected_at:
          type: string
          format: date-time
      required:
      - candidate_name
      - reason
      - rejected_at
    SizeRangeEnum:
      enum:
      - lt50
      - r50_100
      - r100_500
      - r500_1000
      - gt1000
      type: string
      description: |-
        * `lt50` - Under 50 employees
        * `r50_100` - 50–100 employees
        * `r100_500` - 100–500 employees
        * `r500_1000` - 500–1,000 employees
        * `gt1000` - 1,000+ employees
    StatusEnum:
      enum:
      - pending
      - active
      - closed
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `closed` - Closed
    WorkModelEnum:
      enum:
      - onsite
      - hybrid
      - remote
      type: string
      description: |-
        * `onsite` - On-site
        * `hybrid` - Hybrid
        * `remote` - Remote
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
