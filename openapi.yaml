openapi: 3.0.3
info:
  title: Sparktal API
  version: 1.0.0
  description: Sparktal Platform V.1 — Company portal API.
paths:
  /api/v1/applications/{id}/cv:
    get:
      operationId: applications_cv_retrieve
      description: Stream a single CV through the configured Django storage backend.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/candidates:
    get:
      operationId: candidates_list
      parameters:
      - in: query
        name: is_expat
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -expected_salary
          - -full_name
          - -updated_at
          - -years_experience
          - created_at
          - expected_salary
          - full_name
          - updated_at
          - years_experience
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: skills
        schema:
          type: string
      tags:
      - candidates
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateList'
          description: ''
    post:
      operationId: candidates_create
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
  /api/v1/candidates/{id}:
    get:
      operationId: candidates_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
    patch:
      operationId: candidates_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCandidateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCandidateWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
    delete:
      operationId: candidates_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/candidates/{id}/cv:
    get:
      operationId: candidates_cv_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
    put:
      operationId: candidates_cv_upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - candidates
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateCvRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
          description: ''
  /api/v1/chat/channels:
    get:
      operationId: chat_channels_list
      tags:
      - chat
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
          description: ''
  /api/v1/chat/channels/{id}/messages:
    get:
      operationId: chat_channels_messages_list
      parameters:
      - in: query
        name: before
        schema:
          type: string
          format: date-time
        description: Return older messages.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1–50, default 30.
      tags:
      - chat
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: chat_channels_messages_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/chat/channels/{id}/read:
    post:
      operationId: chat_channels_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResult'
          description: ''
  /api/v1/chat/messages/{id}/attachment:
    get:
      operationId: chat_messages_attachment_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/company:
    get:
      operationId: company_retrieve
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: company_partial_update
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/company/banner:
    put:
      operationId: company_banner_update
      tags:
      - companies
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: company_banner_destroy
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/company/complete:
    post:
      operationId: company_complete_create
      tags:
      - companies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/company/home:
    get:
      operationId: company_home_retrieve
      tags:
      - company
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyHome'
          description: ''
  /api/v1/company/logo:
    put:
      operationId: company_logo_update
      tags:
      - companies
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
