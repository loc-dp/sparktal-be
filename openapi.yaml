  /api/v1/candidates/matches:
    post:
      operationId: candidates_matches
      description: |-
        Profiles in your own pool that look like the same person, so a new CV doesn't copy them.

        POST rather than GET: the email and phone stay out of URLs and access logs.
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateMatchRequest'
          application/x-www-form-urlencoded:
            schema:
