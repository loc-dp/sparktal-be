[project]
name = "sparktal-be"
version = "0.1.0"
description = "Sparktal Platform API (Django + DRF)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django~=5.2.17",
    "djangorestframework~=3.18.1",
    "drf-spectacular[sidecar]~=0.30.0",
    "django-allauth[headless,socialaccount,mfa]~=65.19.4",
    "django-cors-headers~=4.9.0",
    "django-filter~=26.1",
    "psycopg[binary,pool]~=3.3.6",
    "django-environ~=0.14.0",
    "channels~=4.3.2",
    "channels-redis~=4.3.0",
    "uvicorn[standard]~=0.53.0",
    "gunicorn~=26.2",
    "uvicorn-worker~=0.4.0",
    "celery[redis]~=5.6.3",
    "django-celery-beat~=2.9.0",
    "redis~=6.4.0",
    "django-redis~=7.0",
    "django-storages[s3]~=1.14.6",
    "boto3~=1.43",
    "whitenoise~=6.12",
    "pypdf~=6.19",
    "pdfplumber~=0.11.10",
    "python-docx~=1.2",
    "rules~=3.5",
    "django-guardian~=3.5.0",
    "django-phonenumber-field[phonenumbers]~=8.5",
    "django-simple-history~=3.13",
    "nh3~=0.3.7",
    "argon2-cffi~=25.1",
    "pillow~=12.3",
    "django-health-check~=4.6",
    "sentry-sdk[django,celery]~=2.69",
]

[dependency-groups]
dev = [
    "daphne~=4.2.3",
    "pytest~=9.1",
    "pytest-django~=4.14",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "pytest-xdist~=3.8",
    "factory-boy~=3.3.3",
    "ruff~=0.16.8",
    "mypy~=2.3.1",
    "django-stubs[compatible-mypy]~=6.1.1",
    "djangorestframework-stubs[compatible-mypy]~=3.18.1",
    "celery-types~=0.26.0",
    "django-debug-toolbar~=8.0",
    "pre-commit~=4.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "media", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/", "/migrations/"]

[[tool.mypy.overrides]]
module = [
    "allauth.*",
    "channels.*",
    "channels_redis.*",
    "environ.*",
    "phonenumber_field.*",
    "simple_history.*",
    "storages.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["factory.*", "faker.*", "rules.*"]
ignore_missing_imports = true
implicit_reexport = true

# django-rules is untyped: its @predicate decorator and add_perm() erase types.
# Rule modules are tiny and covered by permission tests, so relax only these.
[[tool.mypy.overrides]]
module = ["*.rules"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
disable_error_code = ["no-any-return"]

# allauth ships no stubs, so its base classes are `Any`; subclassing them is the
# documented way to customise it.
[[tool.mypy.overrides]]
module = ["apps.accounts.adapter"]
disallow_subclassing_any = false

# factory_boy ships no usable stubs: its declarations (Sequence, Faker, …) and the
# factory call itself are untyped, so strict mode cannot see through them.
# factory_boy has no stubs, so mypy reads `CompanyFactory()` as returning the
# factory rather than the model and floods test files with attr-defined errors.
# Test code is covered by the tests themselves, so these two codes are off here
# only — application modules stay fully strict.
[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
disable_error_code = ["attr-defined", "misc", "arg-type", "comparison-overlap", "assignment"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "-n", "auto"]
